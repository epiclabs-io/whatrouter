# WhatRouter with Docker Compose.
#
# Everything WhatRouter reads and writes lives in one host directory, ./data,
# bind-mounted at /data. That includes config.yaml — the path
# $WHATROUTER_CONFIG points at inside the image — because the MCP management
# tools rewrite it atomically, so it cannot be a read-only mount.
#
# ./data must be writable by uid 1000, the image's `node` user. If it is not:
#
#   sudo chown 1000:1000 data
#
# First run, in order:
#
#   mkdir data && cp config.example.yaml data/config.yaml
#   # ...then edit public_url, profiles, routes and secrets; keep data_dir: /data
#   docker compose run --rm whatrouter check-config
#   docker compose run --rm -it whatrouter pair
#   # ...or, if you cannot scan a QR code on this machine:
#   docker compose run --rm -it whatrouter pair --code +34600000000
#   docker compose up -d
#   curl -s localhost:8466/healthz
#
# Per-instance Hermes env lines:
#
#   docker compose run --rm whatrouter env work

services:
  whatrouter:
    build: .
    image: whatrouter:local
    restart: unless-stopped
    ports:
      - "8466:8466"
    volumes:
      - ./data:/data
    environment:
      - WHATROUTER_LOG_LEVEL=info
      # Secrets can stay out of data/config.yaml as ${WORK_SECRET} etc.
      # - WORK_SECRET=${WORK_SECRET}
