# WhatRouter example configuration.
# In Docker, copy this to the writable volume as /data/config.yaml and edit it there.
# Validate with: whatrouter check-config /data/config.yaml
# Path resolution: --config <path>, else $WHATROUTER_CONFIG, else ./config.yaml.

listen: 0.0.0.0:8466

# Public base URL Hermes instances dial and media URLs are built from.
# Omit it and everything falls back to http://localhost:8466.
public_url: https://whatrouter.example.com

# wa-auth/, whatrouter.sqlite, media/ live here. /data is the Docker volume;
# when running with Node directly, use a writable path such as ./data.
data_dir: /data

log_level: info

whatsapp:
  edit_streaming: true # streams the reply by editing its message; also flips supports_edit in the descriptor
  send_read_receipts: false
  chunk_delay_ms: 300
  send_timeout_ms: 60000

buffer:
  max_age_seconds: 1209600 # 14 days
  wake_cooldown_seconds: 60

media:
  max_bytes: 26214400 # 25 MiB
  retention_seconds: 604800 # 7 days

# null = drop messages from chats no route matches.
default_profile: null

# Profiles may only act on chats routed to them unless this is true.
allow_unrouted_outbound: false

# Optional management toolset: WebSocket /management and Streamable HTTP MCP
# /mcp share this static bearer. Omit the block to disable both routes. The
# secret must be >= 32 chars and differ from every profile secret.
# management:
#   secret: ${WHATROUTER_MANAGEMENT_SECRET}
#   # alternatively:
#   # secret_file: /run/secrets/whatrouter-management

# Registered groups are the account-wide inbound allowlist. Messages from any
# group absent here are dropped, even if that group has a profile route.
# listen: ["*"] accepts every sender and "*" must be the only entry. An empty
# list accepts nobody. User identities may be quoted bare phone numbers, full
# phone JIDs, or explicit <digits>@lid JIDs.
groups:
  "120363001234567890@g.us":
    display_name: Project Room
    admins_seen: 2 # admin count observed when the group was registered
    listen_source: explicit # explicit, or default_admin when MCP chose the default
    listen:
      - "34600000000" # quoted bare number: the readable, recommended form
      # LIDs are also accepted where users are named (routes, allowed_senders,
      # listen) but warn: they are opaque and may not match later traffic.
      # - "987654321098765@lid"

  "120363009876543210@g.us":
    display_name: Bot-Owned Room
    admins_seen: 1
    listen_source: default_admin
    listen: ["*"] # safe registration default only when the bot was the sole admin

profiles:
  work:
    gateway_id: gw-work
    # Any string >= 32 chars; must be unique per profile. Generate with:
    #   openssl rand -hex 32
    secret: replace-me-work-0000000000000000000000
    # Alternatives to an inline secret:
    #   secret: ${WORK_SECRET}            # ${ENV_VAR} interpolation
    #   secret_file: /run/secrets/work    # file contents, trimmed
    display_name: Work Agent
    wake_url: null # optional GET poked when a message arrives while offline
    routes:
      - dm: "+34600000000"
      - group: "120363001234567890@g.us"
        require_mention: true
        # Extra narrowing after the registry listen list; it cannot widen it.
        allowed_senders: ["34600000000"]

  home:
    gateway_id: gw-home
    secret: replace-me-home-0000000000000000000000
    display_name: Home Agent
    wake_url: null
    routes:
      - dm: "+34600000001"
      - group: "120363009876543210@g.us"
        require_mention: false
